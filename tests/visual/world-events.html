<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World events · visual QA</title><style>
*{box-sizing:border-box}body{margin:0;background:#152d39;color:#f6efdd;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:16px;left:16px;width:300px;max-height:calc(100vh - 32px);overflow:auto;background:#132733ed;border:1px solid #64878d;border-radius:12px;padding:16px;box-shadow:0 12px 40px #0005}h1{font-size:18px;margin:0 0 6px}p{color:#b9cdd0;font-size:12px;line-height:1.5;margin:6px 0 12px}label{display:block;margin:12px 0 5px}select,button{border:1px solid #688b91;border-radius:5px;background:#264650;color:#fff;padding:8px;font:inherit}select,input[type=range]{width:100%}button{cursor:pointer}button:hover{background:#386774}.row{display:flex;gap:6px;margin-top:10px}.row button{flex:1}output{font-variant-numeric:tabular-nums}pre{font-size:10px;white-space:pre-wrap;color:#c8dddd}#status{position:fixed;bottom:12px;right:16px;max-width:65vw;background:#132733d9;padding:9px;border-radius:6px;font-size:12px}input[type=checkbox]{margin-right:8px}</style></head><body>
<aside><h1>World events · visual QA</h1><p>Development-only fixtures. Drag to orbit, scroll to zoom. No saves or gameplay changes.</p>
<label for="stage">View</label><select id="stage"><option value="world">Native planet events</option><option value="dragon">Dragon studio</option><option value="chest">Chest studio</option><option value="caravan">Caravan studio</option><option value="shrine">Shrine studio</option><option value="sockets">Tower sockets studio</option></select>
<label for="event">Event</label><select id="event"></select>
<label for="artifact">Installation artifact</label><select id="artifact"><option>lens</option><option>core</option><option>gold</option></select>
<label for="progress">Progress <output id="progress-label">0.000</output></label><input id="progress" type="range" min="0" max="1" step="0.001" value="0">
<div class="row"><button id="play">Play</button><button id="before">Before</button><button id="after">After</button></div><div class="row"><button id="reload">Reload state</button><button id="reset-camera">Reset camera</button></div>
<label for="focus">Focus site</label><select id="focus"><option value="follow">Follow cinematic</option></select>
<label><input id="reduced" type="checkbox">Reduced motion</label><label><input id="mobile" type="checkbox">Mobile geometry (rebuild)</label><label><input id="parts" type="checkbox" checked>Artifact / cargo visible</label>
<label for="pose">Dragon pose</label><select id="pose"><option>flying</option><option>calmed</option><option>sleeping</option></select>
<pre id="state"></pre></aside><div id="status">Building native planet…</div><script type="module" src="./world-events.ts"></script></body></html>
